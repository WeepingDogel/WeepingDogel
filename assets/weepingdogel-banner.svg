<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="WeepingDogel">
  <defs>
    <linearGradient id="wdg-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a9aa6"/>
      <stop offset="0.5" stop-color="#f76eee"/>
      <stop offset="1" stop-color="#9a9aa6"/>
    </linearGradient>
    <linearGradient id="wdg-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="wdg-clip">
      <text x="600" y="118" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="88" font-weight="700" letter-spacing="2">WeepingDogel</text>
    </clipPath>
  </defs>

  <style>
    .wdg-shine-rect {
      animation: wdg-shine 7s linear infinite;
    }
    @keyframes wdg-shine {
      0%   { transform: translateX(0); }
      55%  { transform: translateX(1460px); }
      100% { transform: translateX(1460px); }
    }
    .wdg-drop {
      animation: wdg-drop 5s ease-in infinite;
      opacity: 0;
    }
    .wdg-drop.d2 {
      animation-delay: 2.5s;
    }
    @keyframes wdg-drop {
      0%   { transform: translateY(0); opacity: 0; }
      15%  { opacity: 0.7; }
      80%  { opacity: 0.2; }
      100% { transform: translateY(46px); opacity: 0; }
    }
    .wdg-paw {
      animation: wdg-paw 9s ease-in-out infinite;
      opacity: 0.12;
    }
    .wdg-paw.p2 {
      animation-delay: 4.5s;
    }
    @keyframes wdg-paw {
      0%, 100% { transform: translateY(0); opacity: 0.12; }
      50%      { transform: translateY(-14px); opacity: 0.3; }
    }
    .wdg-ecg {
      stroke-dasharray: 60 400;
      animation: wdg-ecg 3.2s linear infinite;
    }
    @keyframes wdg-ecg {
      from { stroke-dashoffset: 460; }
      to   { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wdg-shine-rect, .wdg-drop, .wdg-paw, .wdg-ecg {
        animation: none !important;
      }
      .wdg-drop { opacity: 0; }
      .wdg-ecg { stroke-dasharray: none; }
    }
  </style>

  <!-- Name with gradient + moving highlight -->
  <text x="600" y="118" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="88" font-weight="700" letter-spacing="2" fill="url(#wdg-text)">WeepingDogel</text>
  <g clip-path="url(#wdg-clip)">
    <rect class="wdg-shine-rect" x="-260" y="38" width="260" height="96" fill="url(#wdg-shine)"/>
  </g>

  <!-- Weeping droplets -->
  <g transform="translate(330,152)">
    <path class="wdg-drop" d="M0,-10 C5,-4 7,1 7,5 A7,7 0 1,1 -7,5 C-7,1 -5,-4 0,-10 Z" fill="#f76eee"/>
  </g>
  <g transform="translate(870,152)">
    <path class="wdg-drop d2" d="M0,-10 C5,-4 7,1 7,5 A7,7 0 1,1 -7,5 C-7,1 -5,-4 0,-10 Z" fill="#f76eee"/>
  </g>

  <!-- Drifting paws -->
  <g transform="translate(120,84)" fill="#f76eee">
    <g class="wdg-paw">
      <ellipse cx="0" cy="7" rx="7" ry="5.5"/>
      <circle cx="-9" cy="-3" r="3"/>
      <circle cx="-3" cy="-7" r="3"/>
      <circle cx="3" cy="-7" r="3"/>
      <circle cx="9" cy="-3" r="3"/>
    </g>
  </g>
  <g transform="translate(1080,84)" fill="#f76eee">
    <g class="wdg-paw p2">
      <ellipse cx="0" cy="7" rx="7" ry="5.5"/>
      <circle cx="-9" cy="-3" r="3"/>
      <circle cx="-3" cy="-7" r="3"/>
      <circle cx="3" cy="-7" r="3"/>
      <circle cx="9" cy="-3" r="3"/>
    </g>
  </g>

  <!-- Heartbeat line with travelling pulse -->
  <path class="wdg-ecg" d="M400,208 H540 L560,196 L580,220 L600,188 L620,212 L640,208 H800" fill="none" stroke="#f76eee" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
</svg>
